# Package boundaries and import cycles, as described in mathutrice/README.md.
name: architecture

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - name: No private name imported from outside its package
        run: uv run tach check
      - name: No import cycle between packages
        run: uv run python scripts/check_cycles.py
